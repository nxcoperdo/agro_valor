name: Sincronizar precio FNC

# El VPS no puede conectarse a federaciondecafeteros.org (le bloquean el rango de IPs
# del proveedor), pero los runners de GitHub sí. Este workflow scrapea el precio
# interno de referencia desde acá afuera y lo empuja al VPS por un endpoint protegido,
# para no tener que actualizarlo a mano.
on:
  schedule:
    # 8:00 y 14:00 hora Colombia (UTC-5) en días hábiles = 13:00 y 19:00 UTC.
    # Se corre unos minutos después de la hora en punto: GitHub documenta que los
    # cron programados exactamente en :00 son los que más se retrasan o se
    # descartan por la carga alta de todo Actions justo en ese instante.
    - cron: '7 13 * * 1-5'
    - cron: '7 19 * * 1-5'
  workflow_dispatch: {}

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run fnc:scrape-and-push
        env:
          VPS_BASE_URL: ${{ secrets.VPS_BASE_URL }}
          FNC_INGEST_TOKEN: ${{ secrets.FNC_INGEST_TOKEN }}
