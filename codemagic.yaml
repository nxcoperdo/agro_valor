workflows:
  ios-simulator:
    name: iOS simulador (sin firma)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Analisis
        script: flutter analyze
      - name: Pruebas
        script: flutter test
      - name: Build para simulador
        script: flutter build ios --simulator --debug
      - name: Empaquetar .app para Appetize
        script: |
          cd build/ios/iphonesimulator
          zip -r Runner-simulator.zip Runner.app
    artifacts:
      - build/ios/iphonesimulator/Runner-simulator.zip
      - mobile/build/ios/iphonesimulator/Runner-simulator.zip

  ios-ipa-sideload:
    name: iOS .ipa sin firma (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Build para dispositivo (release, sin firma)
        script: |
          # Si flutter exige un Development Team pese a --no-codesign, se compila con xcodebuild sin firma.
          if ! flutter build ios --release --no-codesign; then
            flutter build ios --release --no-codesign --config-only
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release               -sdk iphoneos -derivedDataPath build/xc               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            mkdir -p build/ios/iphoneos
            rm -rf build/ios/iphoneos/Runner.app
            cp -r build/xc/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
          fi
      - name: Empaquetar .ipa
        script: |
          cd build/ios/iphoneos
          rm -rf Payload AgroValor-unsigned.ipa
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr AgroValor-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/AgroValor-unsigned.ipa
      - mobile/build/ios/iphoneos/AgroValor-unsigned.ipa
