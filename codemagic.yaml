workflows:
  ios-simulator:
    name: iOS simulador (sin firma)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Analisis
        script: flutter analyze
      - name: Pruebas
        script: flutter test
      - name: Pods
        script: |
          cd ios
          pod install
      - name: Build para simulador
        script: flutter build ios --simulator --debug
      - name: Empaquetar .app para Appetize
        script: |
          cd build/ios/iphonesimulator
          zip -r Runner-simulator.zip Runner.app
    artifacts:
      - mobile/build/ios/iphonesimulator/Runner-simulator.zip
