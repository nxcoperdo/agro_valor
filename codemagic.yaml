workflows:
  ios-simulator:
    name: iOS simulador (sin firma)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Analisis
        script: flutter analyze
      - name: Pruebas
        script: flutter test
      - name: Build para simulador
        script: flutter build ios --simulator --debug
      - name: Empaquetar .app para Appetize
        script: |
          cd build/ios/iphonesimulator
          zip -r Runner-simulator.zip Runner.app
    artifacts:
      - build/ios/iphonesimulator/Runner-simulator.zip
      - mobile/build/ios/iphonesimulator/Runner-simulator.zip

  ios-ipa-sideload:
    name: iOS .ipa sin firma (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Build para dispositivo (release, sin firma)
        script: |
          # Se guarda el log completo y, si falla, se imprimen solo las lineas con el error real.
          flutter build ios --release --no-codesign -v > build.log 2>&1 || {
            echo "=== ERRORES DEL BUILD ==="
            grep -n -i -E "error|failed|exception" build.log | grep -v -i "ignoring\|0 errors" | tail -60
            echo "=== ULTIMAS 60 LINEAS ==="
            tail -60 build.log
            exit 1
          }
      - name: Empaquetar .ipa
        script: |
          cd build/ios/iphoneos
          rm -rf Payload AgroValor-unsigned.ipa
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr AgroValor-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/AgroValor-unsigned.ipa
      - mobile/build/ios/iphoneos/AgroValor-unsigned.ipa
